apiVersion: batch/v1
kind: Job
metadata:
  name: flare-tools-e2e-test
spec:
  template:
    spec:
      containers:
      - name: e2e-test
        image: golang:1.21
        command:
        - /bin/bash
        - -c
        - |
          # Copy binaries from mounted volume
          cp /binaries/flare-admin-linux /usr/local/bin/flare-admin
          cp /binaries/flare-stats-linux /usr/local/bin/flare-stats
          chmod +x /usr/local/bin/flare-admin /usr/local/bin/flare-stats
          
          # Run tests against flare cluster
          flare-admin -i flarei.default.svc.cluster.local -p 13300 list
          flare-stats -i flarei.default.svc.cluster.local -p 13300
          
          echo "E2E tests completed successfully"
        volumeMounts:
        - name: binaries
          mountPath: /binaries
      restartPolicy: Never
      volumes:
      - name: binaries
        configMap:
          name: flare-tools-binaries
  backoffLimit: 1