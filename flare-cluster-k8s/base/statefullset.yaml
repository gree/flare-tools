apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: index
spec:
  selector:
    matchLabels:
      app: flarei
  serviceName: "flarei"
  replicas: 1
  template:
    metadata:
      labels:
        app: flarei
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: flarei
        image: flarei:1.3.4
        command: ['/usr/bin/flarei']
        args: ['-f', '/etc/flarei.conf', '-s']
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 13300
          name: index
        volumeMounts:
        - name: home-flarei
          mountPath: /home/flare
        - name: config
          mountPath: /etc/flarei.conf
          subPath: flarei.conf
      volumes:
        - name: config
          configMap:
            name: flare-config
  volumeClaimTemplates:
  - metadata:
      name: home-flarei
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-storage"
      resources:
        requests:
          storage: 10Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: node
spec:
  selector:
    matchLabels:
      app: flared
  serviceName: "flared"
  replicas: 3
  template:
    metadata:
      labels:
        app: flared
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: flared
        image: flared:1.3.4
        command: ['/usr/bin/flared']
        args: ['-f', '/etc/flared.conf', '-s']
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 13301
          name: node
        volumeMounts:
        - name: home-flared
          mountPath: /home/flare
        - name: config
          mountPath: /etc/flared.conf
          subPath: flared.conf          
      volumes:
        - name: home-flared
          emptyDir:
            medium: Memory
        - name: config
          configMap:
            name: flare-config
