[package]
name = "flare-tools"
version = "1.0.0"
edition = "2021"
authors = ["Flare Tools Contributors"]
description = "Rust implementation of flare-tools for memcached-compatible flare cluster management"
license = "MIT"

[[bin]]
name = "flare-admin"
path = "src/bin/flare-admin.rs"

[[bin]]
name = "flare-stats"
path = "src/bin/flare-stats.rs"

[[bin]]
name = "kubectl-flare"
path = "src/bin/kubectl-flare.rs"

[[bin]]
name = "flare-cluster-repl"
path = "src/bin/flare-cluster-repl.rs"

[dependencies]
bytes = "1.5"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
aws-config = { version = "1.0", optional = true }
aws-sdk-ssm = { version = "1.0", optional = true }
aws-sdk-ec2 = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
aws = ["aws-config", "aws-sdk-ssm", "aws-sdk-ec2"]

[lib]
name = "flare_tools"
path = "src/lib.rs"