apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: flare
spec:
  version: v1.0.0
  homepage: https://github.com/gree/flare-tools
  shortDescription: Manage flare distributed key-value storage clusters
  description: |
    kubectl-flare is a kubectl plugin for managing flare distributed key-value
    storage clusters. It provides a convenient way to run flare-admin and
    flare-stats commands directly on the index server pod without needing to
    manually exec into the pod.

    Examples:
      # List all nodes in the cluster
      kubectl flare admin list

      # Show cluster stats
      kubectl flare stats nodes

      # Add a new slave node
      kubectl flare admin slave server1:12121

      # Check node status
      kubectl flare admin ping server1:12121
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gree/flare-tools/releases/download/v1.0.0/kubectl-flare-darwin-amd64.tar.gz
    sha256: PLACEHOLDER_DARWIN_AMD64_SHA256
    bin: kubectl-flare
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gree/flare-tools/releases/download/v1.0.0/kubectl-flare-darwin-arm64.tar.gz
    sha256: PLACEHOLDER_DARWIN_ARM64_SHA256
    bin: kubectl-flare
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gree/flare-tools/releases/download/v1.0.0/kubectl-flare-linux-amd64.tar.gz
    sha256: PLACEHOLDER_LINUX_AMD64_SHA256
    bin: kubectl-flare
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/gree/flare-tools/releases/download/v1.0.0/kubectl-flare-windows-amd64.tar.gz
    sha256: PLACEHOLDER_WINDOWS_AMD64_SHA256
    bin: kubectl-flare.exe